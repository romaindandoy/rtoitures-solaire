name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier le code
        run: for f in src/*.js; do node --check "$f"; done
      - name: Construire index.html
        run: python3 build.py
      - name: Pas de données perso dans le site
        run: |
          if grep -qiE "BE[0-9]{2} ?[0-9]{4} ?[0-9]{4} ?[0-9]{4}|ghp_[A-Za-z0-9]{20}|AIza[0-9A-Za-z_-]{30}" index.html; then echo "Donnée sensible trouvée"; exit 1; fi
      - run: mkdir -p _site && cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
