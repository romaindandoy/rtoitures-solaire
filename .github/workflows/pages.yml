name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier le code
        run: for f in src/*.js; do node --check "$f"; done
      - name: Construire index.html
        run: python3 build.py
      - name: Pas de données perso dans le site
        run: |
          if grep -qiE "BE[0-9]{2} ?[0-9]{4} ?[0-9]{4} ?[0-9]{4}|ghp_[A-Za-z0-9]{20}|AIza[0-9A-Za-z_-]{30}" index.html; then echo "Donnée sensible trouvée"; exit 1; fi
      - name: Publier sur la branche gh-pages
        run: |
          mkdir site && cp index.html site/ && touch site/.nojekyll
          cd site && git init -q -b gh-pages
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Site du ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
